/* Works on Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: #8b5cf6 #f8fafc;
}

.dark-mode-active * {
    scrollbar-color: #a78bfa #0f172a;
}

/* Works on Chrome, Edge, and Safari */
::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}

::-webkit-scrollbar-track {
  background: #f8fafc;
}

.dark-mode-active ::-webkit-scrollbar-track {
    background: #0f172a;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
  border-radius: 6px;
  border: 3px solid #f8fafc;
  background-clip: content-box;
}

.dark-mode-active ::-webkit-scrollbar-thumb {
    border-color: #0f172a;
}


::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
  background-clip: content-box;
}

/* Corner for when both horizontal and vertical scrollbars are present */
::-webkit-scrollbar-corner {
  background: transparent;
}

  }

}

.logo:hover {
  filter: drop-shadow(0 0 2em #646cffaa);
}

.logo.react:hover {
  filter: drop-shadow(0 0 2em #61dafbaa);
}

@keyframes logo-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

  a:nth-of-type(2) .logo {
    animation: logo-spin infinite 20s linear;
  }
}

.card {
  padding: 2em;
}

.read-the-docs {
  color: #888;
}

/* Estilos para o posicionamento de campos */
.field-box {
  position: absolute;
  border: 2px dashed #2196f3;
  background-color: rgba(33, 150, 243, 0.1);
  cursor: move;
  min-width: 50px;
  min-height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #1976d2;
  font-weight: bold;
  user-select: none;
}

.field-box:hover {
  background-color: rgba(33, 150, 243, 0.2);
  border-color: #1976d2;
}

.field-box.selected {
  border-color: #f44336;
  background-color: rgba(244, 67, 54, 0.1);
  color: #d32f2f;
}

.field-box.hidden {
  opacity: 0.3;
  border-style: dotted;
}

/* Estilos para o canvas de preview */
.canvas-container {
  position: relative;
  display: inline-block;
  max-width: 100%;
  overflow: auto;
}

.canvas-container img {
  max-width: 100%;
  height: auto;
  display: block;
}

/* Estilos para formulários */
.form-section {
  margin-bottom: 24px;
}

.form-section h3 {
  margin-bottom: 16px;
  color: #1976d2;
}

/* Responsividade */
@media (max-width: 768px) {
  .field-box {
    min-width: 40px;
    min-height: 25px;
    font-size: 10px;
  }

  .card {
    padding: 1em;
  }
}
